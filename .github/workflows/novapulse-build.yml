name: NovaPulse validation
on:
  push:
    branches: [main, fix/novapulse-dashboard, feat/solana-launch-batch]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Save reproducible dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-lockfile
          path: package-lock.json
      - name: Export generated lockfile for source synchronization
        if: always()
        run: node -e "const z=require('node:zlib'),f=require('node:fs');const s=z.gzipSync(f.readFileSync('package-lock.json')).toString('base64');for(let i=0;i<s.length;i+=6000)console.log('NOVAPULSE_LOCK_CHUNK:'+s.slice(i,i+6000));"
