name: NovaPulse build validation

on:
  push:
    branches:
      - fix/novapulse-sentry-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Build Next.js
        run: yarn build
